name: Build and deploy full documentation site

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: python -m pip install --disable-pip-version-check Markdown

      - name: Generate complete documentation site
        env:
          PAGES_BASEURL: /data-engineering-learning-roadmap
        run: python scripts/build_site.py

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download static site artifact
        uses: actions/download-pages-artifact@v3

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
