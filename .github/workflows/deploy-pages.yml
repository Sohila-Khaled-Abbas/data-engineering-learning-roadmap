name: Build and deploy full documentation site

on:
  workflow_dispatch:
    inputs:
      public_release_approved:
        description: "I approve publishing this version publicly on GitHub Pages"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.public_release_approved }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: python -m pip install --disable-pip-version-check Markdown

      - name: Generate complete documentation site
        env:
          NAVIGATOR_BASEURL: /data-engineering-learning-roadmap
          PUBLIC_RELEASE_APPROVED: "true"
        run: python scripts/build_navigator.py

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

